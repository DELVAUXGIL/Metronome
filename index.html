<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Métronome</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Share+Tech+Mono&display=swap"
          rel="stylesheet">

    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .font-mono-custom {
            font-family: 'Share Tech Tech', 'Share Tech Mono', monospace;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-full flex flex-col justify-between selection:bg-teal-500 selection:text-slate-950">

<main class="flex-grow flex items-center justify-center p-4 md:p-8">
    <div class="w-full max-w-lg bg-slate-900/60 backdrop-blur-xl p-6 md:p-8 rounded-3xl border border-slate-800 shadow-2xl relative overflow-hidden">
        <div class="absolute -top-24 -left-24 w-48 h-48 bg-teal-500/10 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-red-500/10 rounded-full blur-3xl pointer-events-none"></div>

        <div class="flex items-center justify-between mb-8">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-teal-500 to-emerald-400 flex items-center justify-center shadow-lg shadow-teal-500/20">
                    <i class="fa-solid fa-square-poll-vertical text-slate-950 text-lg"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">
                        Métronome</h1>
                    <p class="text-xs text-slate-500 font-medium">Métronome</p>
                </div>
            </div>
            <div id="visual-indicator"
                 class="w-5 h-5 rounded-full bg-slate-800 border border-slate-700 transition-all duration-75 shadow-[0_0_15px_rgba(20,184,166,0)]"></div>
        </div>

        <div class="bg-slate-950/80 rounded-2xl p-6 border border-slate-800/80 mb-6 text-center relative group">
            <span class="text-xs font-semibold tracking-widest text-slate-500 uppercase block mb-1">Tempo Actuel</span>

            <div class="flex items-center justify-center space-x-6">
                <div class="flex flex-col space-y-1">
                    <button onclick="changeBPM(-5)"
                            class="w-10 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700/50 text-xs font-bold text-slate-400 hover:text-white transition-all">
                        -5
                    </button>
                    <button onclick="changeBPM(-1)"
                            class="w-10 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700/50 text-xs font-bold text-slate-400 hover:text-white transition-all">
                        -1
                    </button>
                </div>

                <div class="relative min-w-[140px]">
                    <span id="bpm-display"
                          class="text-7xl font-bold font-mono-custom text-white tracking-tighter">120</span>
                    <span class="text-xs text-teal-400 font-bold block mt-1 tracking-wider uppercase">BPM</span>
                </div>

                <div class="flex flex-col space-y-1">
                    <button onclick="changeBPM(5)"
                            class="w-10 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700/50 text-xs font-bold text-slate-400 hover:text-white transition-all">
                        +5
                    </button>
                    <button onclick="changeBPM(1)"
                            class="w-10 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700/50 text-xs font-bold text-slate-400 hover:text-white transition-all">
                        +1
                    </button>
                </div>
            </div>

            <div class="mt-6 px-2">
                <input type="range" id="bpm-slider" min="30" max="280" value="120"
                       class="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-teal-400">
            </div>

            <button id="tap-btn"
                    class="mt-4 px-4 py-2 rounded-full bg-slate-900 hover:bg-slate-800 border border-slate-800 text-xs font-bold text-slate-400 hover:text-teal-400 transition-all flex items-center justify-center space-x-2 mx-auto">
                <i class="fa-solid fa-heart-pulse"></i>
                <span>TAP TEMPO</span>
            </button>
        </div>

        <div class="mb-6">
            <div class="flex items-center justify-between mb-3">
                <span class="text-xs font-bold tracking-wider text-slate-400 uppercase">Subdivisions & Accentuation</span>
                <div class="flex space-x-1" id="subdivision-selectors">
                    <button type="button" data-val="1"
                            class="sub-selector-btn px-2.5 py-1 text-xs rounded bg-teal-500 text-slate-950 font-bold">1
                    </button>
                    <button type="button" data-val="2"
                            class="sub-selector-btn px-2.5 py-1 text-xs rounded bg-slate-800 text-slate-400 font-semibold hover:bg-slate-700">
                        2
                    </button>
                    <button type="button" data-val="3"
                            class="sub-selector-btn px-2.5 py-1 text-xs rounded bg-slate-800 text-slate-400 font-semibold hover:bg-slate-700">
                        3
                    </button>
                    <button type="button" data-val="4"
                            class="sub-selector-btn px-2.5 py-1 text-xs rounded bg-slate-800 text-slate-400 font-semibold hover:bg-slate-700">
                        4
                    </button>
                </div>
            </div>

            <div class="bg-slate-950/40 p-4 rounded-xl border border-slate-800/80">
                <div id="sequencer-grid" class="grid grid-cols-4 gap-2">
                </div>
                <p class="text-[10px] text-slate-500 mt-3 text-center">
                    <i class="fa-solid fa-circle-info mr-1"></i> Cliquez sur un pas : <span
                        class="text-teal-400">Fort</span> ➔ <span class="text-slate-400">Normal</span> ➔ <span
                        class="text-red-500/70">Muet</span>
                </p>
            </div>
        </div>

        <div class="bg-slate-950/40 p-4 rounded-xl border border-slate-800/80 mb-6">
            <div class="flex justify-between items-center mb-2">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-eye-slash text-red-400 text-xs"></i>
                    <span class="text-xs font-bold tracking-wider text-slate-400 uppercase">Désactivation Aléatoire (Mute)</span>
                </div>
                <span id="mute-val"
                      class="text-xs font-bold text-red-400 bg-red-500/10 px-2 py-0.5 rounded font-mono-custom">0%</span>
            </div>
            <input type="range" id="mute-slider" min="0" max="100" value="0"
                   class="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-red-400">
        </div>

        <div class="bg-slate-950/40 p-4 rounded-xl border border-slate-800/80 mb-6">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-bell text-teal-400 text-xs"></i>
                    <span class="text-xs font-bold tracking-wider text-slate-400 uppercase">Accentuer le 1er temps (Mesure)</span>
                </div>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="measure-accent-toggle" checked class="sr-only peer">
                    <div class="w-9 h-5 bg-slate-800 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-slate-400 after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-teal-500 peer-checked:after:bg-slate-950"></div>
                </label>
            </div>
        </div>

        <div class="bg-slate-950/40 p-4 rounded-xl border border-slate-800/80 mb-8">
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-gauge-high text-teal-400 text-xs"></i>
                    <span class="text-xs font-bold tracking-wider text-slate-400 uppercase">Speed Trainer</span>
                </div>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="trainer-toggle" class="sr-only peer">
                    <div class="w-9 h-5 bg-slate-800 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-slate-400 after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-teal-500 peer-checked:after:bg-slate-950"></div>
                </label>
            </div>

            <div id="trainer-settings"
                 class="grid grid-cols-2 gap-4 pt-1 transition-all duration-300 opacity-40 pointer-events-none">
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Ajouter (BPM)</label>
                    <div class="flex items-center space-x-2">
                        <input type="number" id="trainer-step" value="2" min="1" max="20"
                               class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-center font-mono-custom focus:outline-none focus:border-teal-500 text-white">
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Toutes les
                        (mesures)</label>
                    <div class="flex items-center space-x-2">
                        <input type="number" id="trainer-bars" value="4" min="1" max="100"
                               class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-center font-mono-custom focus:outline-none focus:border-teal-500 text-white">
                    </div>
                </div>
            </div>
        </div>

        <button id="play-btn"
                class="w-full py-4 rounded-2xl bg-gradient-to-r from-teal-500 to-emerald-400 text-slate-950 font-bold text-lg tracking-wider hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center space-x-3 shadow-xl shadow-teal-500/10">
            <i class="fa-solid fa-play text-lg" id="play-icon"></i>
            <span id="play-text">DÉMARRER</span>
        </button>
    </div>
</main>

<script>
    // Éléments du DOM
    const playBtn = document.getElementById('play-btn');
    const playIcon = document.getElementById('play-icon');
    const playText = document.getElementById('play-text');
    const bpmSlider = document.getElementById('bpm-slider');
    const bpmDisplay = document.getElementById('bpm-display');
    const muteSlider = document.getElementById('mute-slider');
    const muteVal = document.getElementById('mute-val');
    const visualIndicator = document.getElementById('visual-indicator');
    const tapBtn = document.getElementById('tap-btn');
    const sequencerGrid = document.getElementById('sequencer-grid');
    const subSelectorBtns = document.querySelectorAll('.sub-selector-btn');
    const measureAccentToggle = document.getElementById('measure-accent-toggle');

    // Éléments Speed Trainer
    const trainerToggle = document.getElementById('trainer-toggle');
    const trainerSettings = document.getElementById('trainer-settings');
    const trainerStepInput = document.getElementById('trainer-step');
    const trainerBarsInput = document.getElementById('trainer-bars');

    // Moteur Audio State
    let audioCtx = null;
    let isPlaying = false;
    let tempo = 120.0;
    let subdivision = 1;
    let muteChance = 0;

    // Sequencer configuration
    let stepsPattern = {
        1: [2],
        2: [2, 1],
        3: [2, 1, 1],
        4: [2, 1, 1, 1]
    };

    // Variables de Temps Web Audio
    let currentStep = 0;
    let nextStepTime = 0.0;
    let lookahead = 25.0;
    let scheduleAheadTime = 0.1;
    let timerID = null;

    // Compteur de mesures et suivi du 1er temps
    let totalBeatsCount = 0;
    let currentMeasureCount = 0;
    let isFirstBeatOfMeasure = true;

    // Initialisation & Rendu initial du séquenceur
    function renderSequencer() {
        sequencerGrid.innerHTML = '';
        const currentSteps = stepsPattern[subdivision];
        sequencerGrid.className = `grid grid-cols-${subdivision} gap-2`;

        currentSteps.forEach((state, index) => {
            const btn = document.createElement('button');
            btn.className = 'h-12 rounded-xl border flex flex-col items-center justify-center transition-all duration-150 ';

            if (state === 2) {
                btn.className += 'bg-teal-500/20 border-teal-500 text-teal-400 shadow-[0_0_10px_rgba(20,184,166,0.15)]';
                btn.innerHTML = `<span class="text-[9px] font-bold tracking-tight uppercase">Pas ${index + 1}</span><span class="text-xs font-extrabold">ACCENT</span>`;
            } else if (state === 1) {
                btn.className += 'bg-slate-800/80 border-slate-700 text-slate-300';
                btn.innerHTML = `<span class="text-[9px] font-bold text-slate-500 uppercase">Pas ${index + 1}</span><span class="text-xs">NORMAL</span>`;
            } else {
                btn.className += 'bg-slate-950/60 border-slate-900/80 text-slate-600';
                btn.innerHTML = `<span class="text-[9px] font-bold text-slate-700 uppercase">Pas ${index + 1}</span><span class="text-xs font-semibold">COUPE</span>`;
            }

            btn.addEventListener('click', () => {
                let nextState = state === 2 ? 1 : state === 1 ? 0 : 2;
                stepsPattern[subdivision][index] = nextState;
                renderSequencer();
            });

            sequencerGrid.appendChild(btn);
        });
    }

    subSelectorBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            subSelectorBtns.forEach(b => {
                b.className = 'sub-selector-btn px-2.5 py-1 text-xs rounded bg-slate-800 text-slate-400 font-semibold hover:bg-slate-700';
            });
            btn.className = 'sub-selector-btn px-2.5 py-1 text-xs rounded bg-teal-500 text-slate-950 font-bold';
            subdivision = parseInt(btn.dataset.val);
            renderSequencer();
        });
    });

    renderSequencer();

    function updateBPM(newBPM) {
        tempo = Math.max(30, Math.min(280, newBPM));
        bpmSlider.value = tempo;
        bpmDisplay.textContent = tempo;
    }

    window.changeBPM = function (amount) {
        updateBPM(tempo + amount);
    };

    bpmSlider.addEventListener('input', (e) => {
        updateBPM(parseInt(e.target.value));
    });

    muteSlider.addEventListener('input', (e) => {
        muteChance = parseInt(e.target.value);
        muteVal.textContent = muteChance + '%';
    });

    trainerToggle.addEventListener('change', (e) => {
        if (e.target.checked) {
            trainerSettings.classList.remove('opacity-40', 'pointer-events-none');
        } else {
            trainerSettings.classList.add('opacity-40', 'pointer-events-none');
        }
    });

    let tapTimes = [];
    tapBtn.addEventListener('click', (e) => {
        e.preventDefault();
        const now = performance.now();
        if (tapTimes.length > 0 && now - tapTimes[tapTimes.length - 1] > 2500) {
            tapTimes = [];
        }
        tapTimes.push(now);
        if (tapTimes.length >= 2) {
            if (tapTimes.length > 5) tapTimes.shift();
            let intervals = [];
            for (let i = 1; i < tapTimes.length; i++) {
                intervals.push(tapTimes[i] - tapTimes[i - 1]);
            }
            const avgInterval = intervals.reduce((a, b) => a + b) / intervals.length;
            const calculatedBPM = Math.round(60000 / avgInterval);
            updateBPM(calculatedBPM);
        }
        tapBtn.classList.replace('bg-slate-900', 'bg-teal-500/20');
        setTimeout(() => tapBtn.classList.replace('bg-teal-500/20', 'bg-slate-900'), 150);
    });

    function nextNote() {
        const secondsPerBeat = 60.0 / tempo;
        nextStepTime += secondsPerBeat / subdivision;
        currentStep++;

        if (currentStep >= subdivision) {
            currentStep = 0;
            totalBeatsCount++;

            // On détermine si le prochain temps fort entame une nouvelle mesure à 4 temps
            isFirstBeatOfMeasure = (totalBeatsCount % 4 === 0);

            if (trainerToggle.checked && totalBeatsCount % 4 === 0) {
                currentMeasureCount++;
                const targetBars = parseInt(trainerBarsInput.value) || 4;
                if (currentMeasureCount >= targetBars) {
                    currentMeasureCount = 0;
                    const stepBPM = parseInt(trainerStepInput.value) || 2;
                    updateBPM(tempo + stepBPM);
                    bpmDisplay.classList.add('text-teal-400');
                    setTimeout(() => bpmDisplay.classList.remove('text-teal-400'), 500);
                }
            }
        } else {
            // Sur une subdivision intermédiaire, ce n'est jamais le début d'une mesure
            isFirstBeatOfMeasure = false;
        }
    }

    function scheduleNote(stepIdx, time) {
        const stepState = stepsPattern[subdivision][stepIdx];
        setTimeout(() => {
            if (stepIdx === 0) {
                visualIndicator.className = 'w-5 h-5 rounded-full bg-teal-400 border border-teal-300 transition-all duration-75 shadow-[0_0_15px_rgba(20,184,166,0.8)] scale-110';
            } else {
                visualIndicator.className = 'w-5 h-5 rounded-full bg-slate-400 border border-slate-300 transition-all duration-75 shadow-[0_0_10px_rgba(255,255,255,0.4)]';
            }
            setTimeout(() => {
                visualIndicator.className = 'w-5 h-5 rounded-full bg-slate-800 border border-slate-700 transition-all duration-75 shadow-[0_0_15px_rgba(20,184,166,0)] scale-100';
            }, 50);
        }, (time - audioCtx.currentTime) * 1000);

        if (stepState === 0) return;
        const rollDice = Math.random() * 100;
        if (rollDice < muteChance) return;

        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        // Changement de la logique de fréquence pour le premier temps fort de la mesure
        if (stepIdx === 0 && isFirstBeatOfMeasure && measureAccentToggle.checked) {
            osc.frequency.value = 1600; // Son cristallin et très aigu pour marquer la mesure
            gainNode.gain.setValueAtTime(1.4, time);
        } else if (stepState === 2) {
            osc.frequency.value = 1100; // Son accentué classique des autres temps
            gainNode.gain.setValueAtTime(1.1, time);
        } else {
            osc.frequency.value = 750;  // Son normal
            gainNode.gain.setValueAtTime(0.7, time);
        }

        gainNode.gain.exponentialRampToValueAtTime(0.001, time + 0.04);
        osc.start(time);
        osc.stop(time + 0.04);
    }

    function scheduler() {
        while (nextStepTime < audioCtx.currentTime + scheduleAheadTime) {
            scheduleNote(currentStep, nextStepTime);
            nextNote();
        }
        timerID = setTimeout(scheduler, lookahead);
    }

    function toggleMetronome() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (!isPlaying) {
            isPlaying = true;
            playText.textContent = 'ARRÊTER';
            playIcon.className = 'fa-solid fa-stop text-lg';
            playBtn.className = 'w-full py-4 rounded-2xl bg-gradient-to-r from-red-500 to-rose-600 text-white font-bold text-lg tracking-wider hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center space-x-3 shadow-xl shadow-red-500/10';
            currentStep = 0;
            totalBeatsCount = 0;
            currentMeasureCount = 0;
            isFirstBeatOfMeasure = true; // Forcer la première note à être accentuée au départ
            nextStepTime = audioCtx.currentTime + 0.05;
            scheduler();
        } else {
            isPlaying = false;
            playText.textContent = 'DÉMARRER';
            playIcon.className = 'fa-solid fa-play text-lg';
            playBtn.className = 'w-full py-4 rounded-2xl bg-gradient-to-r from-teal-500 to-emerald-400 text-slate-950 font-bold text-lg tracking-wider hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center space-x-3 shadow-xl shadow-teal-500/10';
            clearTimeout(timerID);
        }
    }

    playBtn.addEventListener('click', toggleMetronome);
</script>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('Service Worker enregistré !', reg))
                .catch(err => console.log('Erreur', err));
        });
    }
</script>
</body>
</html>
