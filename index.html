<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Métronome</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-mono-custom { font-family: 'Share Tech Tech', 'Share Tech Mono', monospace; }
        @keyframes pulse-fast { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        .animate-pulse-fast { animation: pulse-fast 0.6s infinite; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-full flex flex-col justify-between selection:bg-teal-500 selection:text-slate-950">

<main class="flex-grow flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-slate-900/60 backdrop-blur-xl p-6 rounded-3xl border border-slate-800 shadow-2xl relative overflow-hidden flex flex-col justify-between">
        <div class="absolute -top-24 -left-24 w-48 h-48 bg-teal-500/10 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-red-500/10 rounded-full blur-3xl pointer-events-none"></div>

        <!-- En-tête -->
        <div class="flex items-center justify-between mb-5">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-teal-500 to-emerald-400 flex items-center justify-center shadow-lg shadow-teal-500/20">
                    <i class="fa-solid fa-square-poll-vertical text-slate-950 text-lg"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">Métronome</h1>
                </div>
            </div>
            <div id="visual-indicator" class="w-5 h-5 rounded-full bg-slate-800 border border-slate-700 transition-all duration-75 shadow-[0_0_15px_rgba(20,184,166,0)]"></div>
        </div>

        <!-- Bloc principal Tempo + Chrono bien GROS -->
        <div class="bg-slate-950/80 rounded-2xl p-5 border border-slate-800/80 mb-4 text-center relative shadow-inner">
            <!-- Chrono valorisé -->
            <div class="text-xs font-mono-custom tracking-widest uppercase mb-1 flex items-center justify-center space-x-2">
                <i class="fa-regular fa-clock text-teal-400 text-sm"></i>
                <span id="chrono-display" class="font-bold text-teal-400 text-xl tracking-wider">00:00</span>
            </div>

            <div class="flex items-center justify-center space-x-4">
                <div class="flex flex-col space-y-2">
                    <button onclick="changeBPM(-5)" class="w-12 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700/50 text-xs font-extrabold text-slate-300 transition-colors">-5</button>
                    <button onclick="changeBPM(-1)" class="w-12 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700/50 text-xs font-extrabold text-slate-300 transition-colors">-1</button>
                </div>

                <div class="relative min-w-[150px]">
                    <span id="bpm-display" class="text-8xl font-bold font-mono-custom text-white tracking-tighter leading-none">120</span>
                    <span class="text-xs text-teal-400 font-extrabold block tracking-widest uppercase mt-2">BPM</span>
                </div>

                <div class="flex flex-col space-y-2">
                    <button onclick="changeBPM(5)" class="w-12 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700/50 text-xs font-extrabold text-slate-300 transition-colors">+5</button>
                    <button onclick="changeBPM(1)" class="w-12 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700/50 text-xs font-extrabold text-slate-300 transition-colors">+1</button>
                </div>
            </div>

            <div class="mt-5 px-1">
                <input type="range" id="bpm-slider" min="30" max="280" value="120" class="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-teal-400">
            </div>

            <button id="tap-btn" class="mt-4 px-5 py-2 rounded-full bg-slate-900 hover:bg-slate-800 border border-slate-800 text-xs font-extrabold text-slate-300 hover:text-teal-400 transition-all flex items-center space-x-2 mx-auto shadow-md">
                <i class="fa-solid fa-heart-pulse text-teal-400"></i>
                <span>TAP TEMPO</span>
            </button>
        </div>

        <!-- Séquenceur -->
        <div class="mb-4">
            <div class="flex items-center justify-between mb-2">
                <span class="text-xs font-bold tracking-wider text-slate-400 uppercase">Subdivisions & Mesure</span>
                <div class="flex space-x-1" id="subdivision-selectors">
                    <button type="button" data-val="1" class="sub-selector-btn px-3 py-1 text-xs rounded-lg bg-teal-500 text-slate-950 font-bold">1</button>
                    <button type="button" data-val="2" class="sub-selector-btn px-3 py-1 text-xs rounded-lg bg-slate-800 text-slate-400 font-semibold">2</button>
                    <button type="button" data-val="3" class="sub-selector-btn px-3 py-1 text-xs rounded-lg bg-slate-800 text-slate-400 font-semibold">3</button>
                    <button type="button" data-val="4" class="sub-selector-btn px-3 py-1 text-xs rounded-lg bg-slate-800 text-slate-400 font-semibold">4</button>
                </div>
            </div>

            <div class="bg-slate-950/40 p-3 rounded-xl border border-slate-800/80">
                <div id="sequencer-grid" class="grid grid-cols-4 gap-2"></div>
            </div>
        </div>

        <!-- LIGNE COMBINÉE : DÉCOMPTE & MUTE ALÉATOIRE -->
        <div class="grid grid-cols-2 gap-3 mb-4">
            <!-- Décompte -->
            <div class="bg-slate-950/40 p-3 rounded-xl border border-slate-800/80 flex flex-col justify-between">
                <span class="text-[11px] font-bold tracking-wider text-slate-400 uppercase block mb-2"><i class="fa-solid fa-hourglass-start text-teal-400 mr-1"></i>Décompte</span>
                <div class="flex space-x-0.5 bg-slate-900 p-0.5 rounded-lg border border-slate-800">
                    <button type="button" data-bars="0" class="countin-btn flex-1 py-1.5 text-xs rounded bg-teal-500 text-slate-950 font-bold">Off</button>
                    <button type="button" data-bars="1" class="countin-btn flex-1 py-1.5 text-xs rounded text-slate-400 font-medium">1 M</button>
                    <button type="button" data-bars="2" class="countin-btn flex-1 py-1.5 text-xs rounded text-slate-400 font-medium">2 M</button>
                </div>
            </div>

            <!-- Mute Aléatoire -->
            <div class="bg-slate-950/40 p-3 rounded-xl border border-slate-800/80 flex flex-col justify-between">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-[11px] font-bold tracking-wider text-slate-400 uppercase"><i class="fa-solid fa-eye-slash text-red-400 mr-1"></i>Mute Aléat.</span>
                    <span id="mute-val" class="text-[11px] font-bold text-red-400 bg-red-500/10 px-1.5 rounded font-mono-custom">0%</span>
                </div>
                <input type="range" id="mute-slider" min="0" max="100" value="0" class="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-red-400 my-1">
            </div>
        </div>

        <!-- TOGGLES FIXÉS ET VISIBLES (BOUTON GAUCHE/DROITE) -->
        <div class="bg-slate-950/40 p-3 rounded-xl border border-slate-800/80 mb-4 flex items-center justify-between text-xs">
            <!-- Accent 1er temps -->
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-bell text-teal-400 text-xs"></i>
                <span class="text-[11px] font-bold tracking-wider text-slate-400 uppercase">Accent 1er T.</span>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="measure-accent-toggle" checked class="sr-only peer">
                    <div class="w-9 h-5 bg-slate-800 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-slate-400 after:border-none after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-teal-500 peer-checked:after:bg-slate-950"></div>
                </label>
            </div>
            <div class="w-[1px] h-5 bg-slate-800"></div>
            <!-- Speed Trainer -->
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-gauge-high text-teal-400 text-xs"></i>
                <span class="text-[11px] font-bold tracking-wider text-slate-400 uppercase">Speed Trainer</span>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="trainer-toggle" class="sr-only peer">
                    <div class="w-9 h-5 bg-slate-800 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-slate-400 after:border-none after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-teal-500 peer-checked:after:bg-slate-950"></div>
                </label>
            </div>
        </div>

        <!-- Paramètres du Speed Trainer -->
        <div id="trainer-settings" class="grid grid-cols-2 gap-3 p-3 bg-slate-950/20 rounded-xl border border-slate-800/50 mb-4 transition-all duration-300 opacity-40 pointer-events-none hidden">
            <div class="flex items-center justify-between">
                <label class="text-[11px] font-bold text-slate-500 uppercase">BPM +</label>
                <input type="number" id="trainer-step" value="2" min="1" max="20" class="w-14 bg-slate-950 border border-slate-800 rounded-md py-1 text-xs text-center font-mono-custom text-white">
            </div>
            <div class="flex items-center justify-between">
                <label class="text-[11px] font-bold text-slate-500 uppercase">Mesures</label>
                <input type="number" id="trainer-bars" value="4" min="1" max="100" class="w-14 bg-slate-950 border border-slate-800 rounded-md py-1 text-xs text-center font-mono-custom text-white">
            </div>
        </div>

        <!-- Bouton Démarrer / Arrêter imposant -->
        <button id="play-btn" class="w-full py-4 rounded-2xl bg-gradient-to-r from-teal-500 to-emerald-400 text-slate-950 font-extrabold text-base tracking-widest hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center space-x-2 shadow-xl shadow-teal-500/10 mt-1">
            <i class="fa-solid fa-play text-lg" id="play-icon"></i>
            <span id="play-text">DÉMARRER</span>
        </button>
    </div>
</main>

<script>
    const playBtn = document.getElementById('play-btn');
    const playIcon = document.getElementById('play-icon');
    const playText = document.getElementById('play-text');
    const bpmSlider = document.getElementById('bpm-slider');
    const bpmDisplay = document.getElementById('bpm-display');
    const muteSlider = document.getElementById('mute-slider');
    const muteVal = document.getElementById('mute-val');
    const visualIndicator = document.getElementById('visual-indicator');
    const tapBtn = document.getElementById('tap-btn');
    const sequencerGrid = document.getElementById('sequencer-grid');
    const subSelectorBtns = document.querySelectorAll('.sub-selector-btn');
    const measureAccentToggle = document.getElementById('measure-accent-toggle');
    const countinBtns = document.querySelectorAll('.countin-btn');
    const trainerToggle = document.getElementById('trainer-toggle');
    const trainerSettings = document.getElementById('trainer-settings');
    const trainerStepInput = document.getElementById('trainer-step');
    const trainerBarsInput = document.getElementById('trainer-bars');
    const chronoDisplay = document.getElementById('chrono-display');

    let audioCtx = null, isPlaying = false, tempo = 120.0, subdivision = 1, muteChance = 0;
    let countInBarsSetting = 0, countInBeatsRemaining = 0, isCountingIn = false;
    let stepsPattern = { 1: [2], 2: [2, 1], 3: [2, 1, 1], 4: [2, 1, 1, 1] };
    let currentStep = 0, nextStepTime = 0.0, lookahead = 25.0, scheduleAheadTime = 0.1, timerID = null;
    let totalBeatsCount = 0, currentMeasureCount = 0, isFirstBeatOfMeasure = true;
    let wakeLock = null;

    let chronoTimerID = null, chronoStartTime = 0;

    countinBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            countinBtns.forEach(b => b.className = 'countin-btn flex-1 py-1.5 text-xs rounded text-slate-400 font-medium');
            btn.className = 'countin-btn flex-1 py-1.5 text-xs rounded bg-teal-500 text-slate-950 font-bold';
            countInBarsSetting = parseInt(btn.dataset.bars);
        });
    });

    function renderSequencer() {
        sequencerGrid.innerHTML = '';
        const currentSteps = stepsPattern[subdivision];
        sequencerGrid.className = `grid grid-cols-${subdivision} gap-2`;
        currentSteps.forEach((state, index) => {
            const btn = document.createElement('button');
            btn.className = 'py-3 rounded-xl border flex flex-col items-center justify-center transition-all duration-150 text-xs font-bold ';
            if (state === 2) {
                btn.className += 'bg-teal-500/20 border-teal-500 text-teal-400';
                btn.innerText = 'ACCENT';
            } else if (state === 1) {
                btn.className += 'bg-slate-800/80 border-slate-700 text-slate-300';
                btn.innerText = 'NORM';
            } else {
                btn.className += 'bg-slate-950/60 border-slate-900/80 text-slate-600';
                btn.innerText = 'MUTÉ';
            }
            btn.addEventListener('click', () => {
                stepsPattern[subdivision][index] = state === 2 ? 1 : state === 1 ? 0 : 2;
                renderSequencer();
            });
            sequencerGrid.appendChild(btn);
        });
    }

    subSelectorBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            subSelectorBtns.forEach(b => b.className = 'sub-selector-btn px-2.5 py-1 text-xs rounded bg-slate-800 text-slate-400 font-semibold');
            btn.className = 'sub-selector-btn px-2.5 py-1 text-xs rounded bg-teal-500 text-slate-950 font-bold';
            subdivision = parseInt(btn.dataset.val);
            renderSequencer();
        });
    });

    renderSequencer();

    function updateBPM(newBPM) {
        tempo = Math.max(30, Math.min(280, newBPM));
        bpmSlider.value = tempo;
        bpmDisplay.textContent = tempo;
    }

    window.changeBPM = function (amount) { updateBPM(tempo + amount); };
    bpmSlider.addEventListener('input', (e) => updateBPM(parseInt(e.target.value)));
    muteSlider.addEventListener('input', (e) => {
        muteChance = parseInt(e.target.value);
        muteVal.textContent = muteChance + '%';
    });

    trainerToggle.addEventListener('change', (e) => {
        if (e.target.checked) {
            trainerSettings.classList.remove('hidden');
            setTimeout(() => trainerSettings.classList.remove('opacity-40', 'pointer-events-none'), 10);
        } else {
            trainerSettings.classList.add('opacity-40', 'pointer-events-none');
            setTimeout(() => trainerSettings.classList.add('hidden'), 300);
        }
    });

    let tapTimes = [];
    tapBtn.addEventListener('click', (e) => {
        e.preventDefault();
        const now = performance.now();
        if (tapTimes.length > 0 && now - tapTimes[tapTimes.length - 1] > 2500) tapTimes = [];
        tapTimes.push(now);
        if (tapTimes.length >= 2) {
            if (tapTimes.length > 5) tapTimes.shift();
            let intervals = [];
            for (let i = 1; i < tapTimes.length; i++) intervals.push(tapTimes[i] - tapTimes[i - 1]);
            updateBPM(Math.round(60000 / (intervals.reduce((a, b) => a + b) / intervals.length)));
        }
    });

    function startChrono() {
        if (chronoTimerID) clearInterval(chronoTimerID);
        chronoStartTime = Date.now();
        chronoTimerID = setInterval(updateChrono, 1000);
    }

    function updateChrono() {
        const totalSeconds = Math.floor((Date.now() - chronoStartTime) / 1000);
        const mins = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
        const secs = (totalSeconds % 60).toString().padStart(2, '0');
        chronoDisplay.textContent = `${mins}:${secs}`;
    }

    function resetChrono() {
        if (chronoTimerID) clearInterval(chronoTimerID);
        chronoTimerID = null;
        chronoDisplay.textContent = "00:00";
    }

    function nextNote() {
        const secondsPerBeat = 60.0 / tempo;
        if (isCountingIn) {
            nextStepTime += secondsPerBeat;
            countInBeatsRemaining--;
            setTimeout(() => { if (isPlaying && isCountingIn) playText.textContent = `DÉCOMPTE... ${countInBeatsRemaining}`; }, 0);
            if (countInBeatsRemaining <= 0) {
                isCountingIn = false;
                currentStep = 0; totalBeatsCount = 0; currentMeasureCount = 0; isFirstBeatOfMeasure = true;
                setTimeout(() => {
                    if (isPlaying) {
                        playText.textContent = 'ARRÊTER';
                        playBtn.className = 'w-full py-4 rounded-2xl bg-gradient-to-r from-red-500 to-rose-600 text-white font-extrabold text-base tracking-widest flex items-center justify-center space-x-2 shadow-xl';
                        startChrono();
                    }
                }, 0);
            }
            return;
        }
        nextStepTime += secondsPerBeat / subdivision;
        currentStep++;
        if (currentStep >= subdivision) {
            currentStep = 0;
            totalBeatsCount++;
            isFirstBeatOfMeasure = (totalBeatsCount % 4 === 0);
            if (trainerToggle.checked && totalBeatsCount % 4 === 0) {
                currentMeasureCount++;
                if (currentMeasureCount >= (parseInt(trainerBarsInput.value) || 4)) {
                    currentMeasureCount = 0;
                    updateBPM(tempo + (parseInt(trainerStepInput.value) || 2));
                }
            }
        } else { isFirstBeatOfMeasure = false; }
    }

    function scheduleNote(stepIdx, time) {
        setTimeout(() => {
            if (isCountingIn || stepIdx === 0) {
                visualIndicator.className = 'w-5 h-5 rounded-full bg-teal-400 border border-teal-300 transition-all duration-75 shadow-[0_0_15px_rgba(20,184,166,0.8)] scale-110';
            } else {
                visualIndicator.className = 'w-5 h-5 rounded-full bg-slate-400 border border-slate-300 transition-all duration-75 shadow-[0_0_10px_rgba(255,255,255,0.4)]';
            }
            setTimeout(() => { visualIndicator.className = 'w-5 h-5 rounded-full bg-slate-800 border border-slate-700 transition-all duration-75 scale-100'; }, 50);
        }, (time - audioCtx.currentTime) * 1000);

        if (isCountingIn) {
            const osc = audioCtx.createOscillator(), gainNode = audioCtx.createGain();
            osc.connect(gainNode); gainNode.connect(audioCtx.destination);
            osc.frequency.value = countInBeatsRemaining === (countInBarsSetting * 4) ? 1200 : 850;
            gainNode.gain.setValueAtTime(1.0, time); gainNode.gain.exponentialRampToValueAtTime(0.001, time + 0.04);
            osc.start(time); osc.stop(time + 0.04);
            return;
        }

        if (stepsPattern[subdivision][stepIdx] === 0 || Math.random() * 100 < muteChance) return;
        const osc = audioCtx.createOscillator(), gainNode = audioCtx.createGain();
        osc.connect(gainNode); gainNode.connect(audioCtx.destination);
        if (stepIdx === 0 && isFirstBeatOfMeasure && measureAccentToggle.checked) {
            osc.frequency.value = 1600; gainNode.gain.setValueAtTime(1.4, time);
        } else if (stepsPattern[subdivision][stepIdx] === 2) {
            osc.frequency.value = 1100; gainNode.gain.setValueAtTime(1.1, time);
        } else {
            osc.frequency.value = 750; gainNode.gain.setValueAtTime(0.7, time);
        }
        gainNode.gain.exponentialRampToValueAtTime(0.001, time + 0.04);
        osc.start(time); osc.stop(time + 0.04);
    }

    function scheduler() {
        while (nextStepTime < audioCtx.currentTime + scheduleAheadTime) {
            scheduleNote(isCountingIn ? 0 : currentStep, nextStepTime);
            nextNote();
        }
        timerID = setTimeout(scheduler, lookahead);
    }

    async function requestWakeLock() {
        try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
    }
    function releaseWakeLock() { if (wakeLock !== null) { wakeLock.release().then(() => wakeLock = null); } }

    function toggleMetronome() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (!isPlaying) {
            isPlaying = true;
            resetChrono();
            if (countInBarsSetting > 0) {
                isCountingIn = true; countInBeatsRemaining = countInBarsSetting * 4;
                playText.textContent = `DÉCOMPTE... ${countInBeatsRemaining}`;
                playBtn.className = 'w-full py-4 rounded-2xl bg-gradient-to-r from-amber-500 to-orange-600 text-white font-extrabold text-base tracking-widest flex items-center justify-center space-x-2 shadow-xl animate-pulse-fast';
                playIcon.className = 'fa-solid fa-hourglass-half text-lg';
            } else {
                isCountingIn = false; playText.textContent = 'ARRÊTER';
                playBtn.className = 'w-full py-4 rounded-2xl bg-gradient-to-r from-red-500 to-rose-600 text-white font-extrabold text-base tracking-widest flex items-center justify-center space-x-2 shadow-xl';
                playIcon.className = 'fa-solid fa-stop text-lg';
                startChrono();
            }
            currentStep = 0; totalBeatsCount = 0; currentMeasureCount = 0; isFirstBeatOfMeasure = true;
            nextStepTime = audioCtx.currentTime + 0.05;
            scheduler(); requestWakeLock();
        } else {
            isPlaying = false; isCountingIn = false; playText.textContent = 'DÉMARRER';
            playIcon.className = 'fa-solid fa-play text-lg';
            playBtn.className = 'w-full py-4 rounded-2xl bg-gradient-to-r from-teal-500 to-emerald-400 text-slate-950 font-extrabold text-base tracking-widest flex items-center justify-center space-x-2 shadow-xl';
            clearTimeout(timerID); releaseWakeLock();
            resetChrono();
        }
    }

    playBtn.addEventListener('click', toggleMetronome);
    document.addEventListener('visibilitychange', async () => {
        if (wakeLock !== null && document.visibilityState === 'visible' && isPlaying) await requestWakeLock();
    });
</script>
</body>
</html>
